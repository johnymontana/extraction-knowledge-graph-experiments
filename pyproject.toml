[project]
name = "extraction-sandbox"
version = "0.1.0"
description = "Entity extraction and resolution for knowledge graphs — agent memory and document intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gliner2[local]>=2.0.0",
    "protobuf>=5.0",          # required by the DeBERTa-v3 SPM tokenizer
    "sentencepiece>=0.2",     # ditto
    "networkx>=3.0",
    "rapidfuzz>=3.0",
    "sentence-transformers>=3.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyvis>=0.3.2",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "neo4j>=6.2.0",
    "neo4j-graphrag[sentence-transformers]>=1.18.0",
    "neo4j-viz>=1.8.0",
    "spacy>=3.8.16",
    "splink>=4.0.16",
    "dedupe>=3.0.3",
    "en-core-web-lg",
    "en-core-web-trf",
    "btrees<6",
    "fastcoref>=2.1.6",
    "stanza>=1.14.0",
    "peft>=0.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgx"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
en-core-web-trf = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl" }
